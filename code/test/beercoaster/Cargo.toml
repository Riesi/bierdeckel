[package]
edition      = "2024"
name         = "beercoaster"
rust-version = "1.96"
version      = "0.1.0"
build = "build.rs"

[[bin]]
name = "beercoaster"

[dependencies]
esp-storage = "0.10.0"
esp-rom-sys = "0.1.5"
esp-hal = { version = "~1.2.1", features = ["esp32c3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-hal-async = "1.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.11.0"
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
bt-hci = "0.10.1"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-futures = { version = "0.1.2" }
esp-radio = { version = "1.0.0-beta.1", features = [
  "ble",
  "coex",
  "esp-alloc",
  "esp32c3",
  "log-04",
  "unstable",
  "wifi",
] }


trouble-host = { version = "0.8.0",  features = ["derive", "gatt", "peripheral", "default-packet-pool-mtu-255", "security"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

embedded-hal = {version = "1.0.0"}

smart-leds = "0.4.0"
esp-hal-smartled = {version = "0.18.0", features = ["esp32c3"]}

num-derive = "0.5.1"
num-traits = {version = "0.2.19",default-features = false}

nb = "1.1.0"
# single_value_channel = "1.2.2"

[build-dependencies]
#embuild = "0.33.3"
anyhow = "1"
vergen-gitcl = { version = "9.1.0", features = ["build", "cargo", "rustc", "si"] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
